<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Element Print · 打印预览</title>
  <link rel="stylesheet" href="../shared/article.css" />
  <link rel="stylesheet" href="../shared/themes/academic.css" />
  <link rel="stylesheet" href="../shared/themes/gov.css" />
  <link rel="stylesheet" href="preview.css" />
  <style id="pageRule"></style>
</head>
<body>
  <div class="ep-app">
    <main class="ep-stage">
      <div class="ep-hint">
        <span class="ep-hint__text" id="hintText">右侧设置即时生效 · 打印为 A4 纵向</span>
        <span class="ep-count" id="wordCount"></span>
        <div class="ep-hint__actions">
          <button type="button" id="editBtn" class="ep-mini" title="进入编辑：直接修改标题、正文与页眉页脚（Esc 退出，有改动会确认）">编辑</button>
          <button type="button" id="trimBtn" class="ep-mini" title="进入删减：点击要删掉的段落、图片或表格所在块（Esc 退出）">删减</button>
          <button type="button" id="titleBtn" class="ep-mini" title="设置标题：从正文选择并替换当前标题（Esc 退出）">标题</button>
          <button type="button" id="imgBtn" class="ep-mini" title="切换图片显示：无图时图片不参与排版与打印">有图</button>
          <div class="ep-bi-switch">
            <button type="button" id="origBtn" class="ep-mini ep-mini--soft ep-mini--seg" title="回到单栏原文视图">原文</button>
            <span class="ep-bi-switch__sep" id="origMixSep"></span>
            <button type="button" id="mixBtn" class="ep-mini ep-mini--soft ep-mini--seg" hidden title="按原网页的中英混排方式显示">混排</button>
            <span class="ep-bi-switch__sep" id="mixSep" hidden></span>
            <button type="button" id="biBtn" class="ep-mini ep-mini--soft ep-mini--seg" title="翻译：A4/电纸书左右对照；手机自动按原文/译文串行排列">翻译</button>
          </div>
        </div>
      </div>
      <!-- 编辑时的格式栏：作用于当前选区，全部为图标按钮，悬停显示名称 -->
      <div class="ep-format" id="formatBar" hidden>
        <button type="button" class="ep-fmt" data-cmd="fontDown" title="缩小字号" aria-label="缩小字号">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="3" y="12" font-size="11" fill="currentColor">A</text><text x="8.5" y="8" font-size="7.5" fill="currentColor">−</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="fontUp" title="放大字号" aria-label="放大字号">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="2.5" y="12" font-size="11" fill="currentColor">A</text><text x="8.5" y="8" font-size="7.5" fill="currentColor">+</text></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="bold" title="粗体" aria-label="粗体">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">B</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="italic" title="斜体" aria-label="斜体">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="13" font-style="italic" font-family="Georgia,serif" fill="currentColor">I</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="underline" title="下划线" aria-label="下划线">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="11.5" text-anchor="middle" font-size="12" fill="currentColor">U</text><rect x="3.5" y="13.2" width="9" height="1.4" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="strikeThrough" title="删除线" aria-label="删除线">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor">S</text><rect x="3" y="7.3" width="10" height="1.3" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="justifyLeft" title="左对齐" aria-label="左对齐">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="1.6" fill="currentColor"/><rect x="2.5" y="7.2" width="7" height="1.6" fill="currentColor"/><rect x="2.5" y="11.4" width="11" height="1.6" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="justifyCenter" title="居中" aria-label="居中">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="1.6" fill="currentColor"/><rect x="4.5" y="7.2" width="7" height="1.6" fill="currentColor"/><rect x="2.5" y="11.4" width="11" height="1.6" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="justifyRight" title="右对齐" aria-label="右对齐">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="1.6" fill="currentColor"/><rect x="6.5" y="7.2" width="7" height="1.6" fill="currentColor"/><rect x="2.5" y="11.4" width="11" height="1.6" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="indent" title="首行缩进" aria-label="首行缩进">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="3" width="7.5" height="1.6" fill="currentColor"/><rect x="6" y="7.2" width="7.5" height="1.6" fill="currentColor"/><rect x="6" y="11.4" width="7.5" height="1.6" fill="currentColor"/><path d="M2.2 6.2 L4.6 8 L2.2 9.8 Z" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="h2" title="一级标题" aria-label="一级标题">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">H2</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="h3" title="二级标题" aria-label="二级标题">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">H3</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="quote" title="引文块" aria-label="引文块">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.4" y="3.4" width="1.6" height="9.2" fill="currentColor"/><text x="4" y="12" font-size="12" font-family="Georgia,serif" fill="currentColor">“</text></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="ol" title="有序列表" aria-label="有序列表">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="1" y="5.6" font-size="5" fill="currentColor">1</text><text x="1" y="10.6" font-size="5" fill="currentColor">2</text><text x="1" y="15.4" font-size="5" fill="currentColor">3</text><rect x="6" y="3.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="8.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="13.2" width="9" height="1.4" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="ul" title="无序列表" aria-label="无序列表">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="2.6" cy="4.1" r="1.5" fill="currentColor"/><circle cx="2.6" cy="9.1" r="1.5" fill="currentColor"/><circle cx="2.6" cy="13.7" r="1.5" fill="currentColor"/><rect x="6" y="3.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="8.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="13.2" width="9" height="1.4" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="clearFormat" title="清除格式" aria-label="清除格式">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="6" y="12" text-anchor="middle" font-size="12" fill="currentColor">A</text><rect x="5.3" y="1.5" width="1.4" height="13" fill="currentColor" transform="rotate(70 6 8)"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="replace" title="查找并替换（替换文本可空）" aria-label="查找并替换">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="1" y="12" font-size="9" fill="currentColor">A</text><path d="M6.4 8h3.4M8.4 5.6L10.8 8L8.4 10.4" stroke="currentColor" fill="none" stroke-width="1.1"/><text x="11" y="12" font-size="9" fill="currentColor">B</text></svg>
        </button>
      </div>
      <!-- 查找替换面板：在标题、正文、页眉页脚的文本节点内全局替换 -->
      <div class="ep-replace" id="replacePanel" hidden>
        <input class="ep-input" id="replaceFind" type="text" placeholder="查找文本" autocomplete="off" />
        <input class="ep-input" id="replaceRepl" type="text" placeholder="替换为（留空删除）" autocomplete="off" />
        <button type="button" id="replaceGo" class="ep-mini">替换</button>
        <button type="button" id="replaceClose" class="ep-mini">取消</button>
      </div>
      <!-- 翻译进度提示：浮在工具栏右下方 -->
      <div class="ep-toast" id="translateToast" hidden><span class="ep-toast__dot"></span><span id="translateToastText"></span></div>
      <div class="ep-viewport" id="viewport">
        <div class="ep-sheetWrap" id="sheetWrap">
            <div class="ep-sheet" id="sheet" data-theme="paper">
            <div class="ep-gutter ep-gutter--head" id="pageHead">
              <span class="ep-gutter__title">Element Print</span>
              <span class="ep-gutter__src" id="pageSource"><a id="siteLink" href="#" target="_blank" rel="noreferrer"></a></span>
            </div>
            <div class="ep-head">
              <h1 class="ep-title" id="title"></h1>
              <p class="ep-title-trans" id="titleTrans" hidden></p>
              <p class="ep-excerpt" id="excerpt" hidden></p>
              <p class="ep-excerpt-trans" id="excerptTrans" hidden></p>
              <div class="ep-rule"></div>
              <div class="ep-meta" id="meta">
                <span class="ep-meta__byline">
                  <span id="metaAuthor" hidden></span>
                  <span id="metaPubDate" hidden></span>
                </span>
                <a class="ep-meta__url" id="metaUrl" href="#" target="_blank" rel="noreferrer"></a>
                <span class="ep-meta__time" id="metaTime"></span>
              </div>
            </div>
            <div class="ep-body" id="body"></div>
            <div class="ep-bilingual ep-body" id="bilingual" hidden></div>
            <div class="ep-body" id="mixed" hidden></div>
            <div class="ep-body" id="serial" hidden></div>
            <p class="ep-end-quote" id="endQuote" hidden></p>
            <div class="ep-gutter ep-gutter--foot" id="pageFoot">
              <span class="ep-gutter__quote" id="pageQuote"></span>
              <span class="ep-gutter__page" id="pageNo"></span>
            </div>
          </div>
        </div>
        <div class="ep-error" id="error" hidden></div>
      </div>
    </main>

    <aside class="ep-panel">
      <header class="ep-panel__head">
        <div class="ep-panel__title">版式设置</div>
        <button type="button" id="resetBtn" class="ep-mini">重置版式</button>
      </header>

      <div class="ep-panel__body">
        <section class="ep-field">
          <div class="ep-field__label">输出对象</div>
          <div class="ep-seg ep-seg--three" id="segPageFormat">
            <button type="button" data-value="a4" class="is-active">A4纸</button>
            <button type="button" data-value="ereader" title="10寸左右的大屏电纸书">电纸书</button>
            <button type="button" data-value="mobile">手机</button>
          </div>
        </section>

        <section class="ep-field">
          <div class="ep-field__label">版式</div>
          <div class="ep-seg ep-seg--three" id="segTheme">
            <button type="button" data-value="paper" class="is-active">原版</button>
            <button type="button" data-value="academic">学术期刊</button>
            <button type="button" data-value="gov">公文</button>
          </div>
        </section>

        <section class="ep-field">
          <div class="ep-field__label">栏数</div>
          <div class="ep-seg" id="segColumns">
            <button type="button" data-value="1" class="is-active">单栏</button>
            <button type="button" data-value="2">两栏</button>
          </div>
          <em class="ep-check__note" id="columnsNote"></em>
        </section>

        <section class="ep-field">
          <div class="ep-field__label">图片大小</div>
          <div class="ep-seg ep-seg--three" id="segImgSize">
            <button type="button" data-value="small">小</button>
            <button type="button" data-value="mid">中</button>
            <button type="button" data-value="full" class="is-active">原大</button>
          </div>
        </section>

        <section class="ep-field">
          <div class="ep-field__label">正文字体</div>
          <select class="ep-select" id="bodyFont"></select>
        </section>

        <section class="ep-field">
          <div class="ep-field__label">字重</div>
          <div class="ep-seg ep-seg--four" id="segBodyWeight">
            <button type="button" data-value="normal" class="is-active">常规</button>
            <button type="button" data-value="medium">中等</button>
            <button type="button" data-value="semibold">半粗</button>
            <button type="button" data-value="bold">粗体</button>
          </div>
        </section>

        <section class="ep-field">
          <div class="ep-field__label">标题字体</div>
          <select class="ep-select" id="titleFont"></select>
        </section>

        <section class="ep-field">
          <div class="ep-field__row"><span>正文字号</span><em id="vFontSize"></em></div>
          <input id="fontSize" type="range" min="9" max="20" step="0.5" />
        </section>

        <section class="ep-field">
          <div class="ep-field__row"><span>标题字号</span><em id="vTitleSize"></em></div>
          <input id="titleSize" type="range" min="12" max="40" step="0.5" />
        </section>

        <section class="ep-field">
          <div class="ep-field__label">行距</div>
          <div class="ep-seg" id="segLineMode">
            <button type="button" data-value="ratio" class="is-active">按倍数</button>
            <button type="button" data-value="fixed">固定磅值</button>
          </div>
          <div class="ep-field__row ep-row-gap"><span>行高</span><em id="vLineHeight"></em></div>
          <input id="lineHeight" type="range" min="1.2" max="2.4" step="0.05" />
        </section>

        <section class="ep-field">
          <div class="ep-field__row"><span>段前间距</span><em id="vParaBefore"></em></div>
          <input id="paraBefore" type="range" min="0" max="40" step="1" />
        </section>

        <section class="ep-field">
          <div class="ep-field__row"><span>段后间距</span><em id="vParaAfter"></em></div>
          <input id="paraAfter" type="range" min="0" max="48" step="1" />
        </section>

        <section class="ep-field">
          <div class="ep-field__row"><span>首行缩进</span><em id="vIndent"></em></div>
          <input id="indent" type="range" min="0" max="4" step="1" />
        </section>

        <section class="ep-field">
          <div class="ep-field__label ep-label-row">
            <span>页边距（mm）</span>
            <span class="ep-pills" id="segMarginPreset">
              <button type="button" data-value="narrow" class="ep-pill">窄</button>
              <button type="button" data-value="medium" class="ep-pill">中</button>
              <button type="button" data-value="wide" class="ep-pill">宽</button>
            </span>
          </div>
          <div class="ep-margins">
            <div class="ep-margin">
              <div class="ep-field__row"><span>上</span><em id="vMarginTop"></em></div>
              <input id="marginTop" type="range" min="3" max="40" step="1" />
            </div>
            <div class="ep-margin">
              <div class="ep-field__row"><span>下</span><em id="vMarginBottom"></em></div>
              <input id="marginBottom" type="range" min="3" max="40" step="1" />
            </div>
            <div class="ep-margin">
              <div class="ep-field__row"><span>左</span><em id="vMarginLeft"></em></div>
              <input id="marginLeft" type="range" min="3" max="40" step="1" />
            </div>
            <div class="ep-margin">
              <div class="ep-field__row"><span>右</span><em id="vMarginRight"></em></div>
              <input id="marginRight" type="range" min="3" max="40" step="1" />
            </div>
          </div>
        </section>

        <section class="ep-field ep-field--checks">
          <label class="ep-check"><input type="checkbox" id="showUrl" /><span>显示网址</span></label>
          <label class="ep-check"><input type="checkbox" id="showTime" /><span>显示时间戳</span></label>
          <label class="ep-check"><input type="checkbox" id="spanHead" /><span>一级标题跨栏（双栏时）</span></label>
          <label class="ep-check"><input type="checkbox" id="allowBreak" /><span>段落可跨页<em class="ep-check__note">取消勾选则整段移到下一页</em></span></label>
          <label class="ep-check"><input type="checkbox" id="showHeader" /><span>显示页眉</span></label>
          <label class="ep-check"><input type="checkbox" id="showFooter" /><span>显示页脚<em class="ep-check__note">A4 右下页码，电纸书只格言</em></span></label>
          <label class="ep-check"><input type="checkbox" id="showQuote" /><span>页脚名言<em class="ep-check__note">随机一句，取自本地名句库</em></span></label>
          <label class="ep-check"><input type="checkbox" id="closeAfterPrint" /><span>打印后自动关闭<em class="ep-check__note">打印后关闭预览页</em></span></label>
        </section>

        <section class="ep-field">
          <div class="ep-field__label">双语对照</div>
          <label class="ep-check"><input type="checkbox" id="bilingualOn" /><span>自动翻译</span></label>
          <div class="ep-field__row ep-row-gap"><span>翻译引擎</span><button type="button" id="translateBtn" class="ep-mini">翻译</button></div>
          <select class="ep-select" id="biEngine">
            <option value="deepl">DeepL</option>
            <option value="baidu">百度翻译</option>
          </select>
          <em class="ep-check__note" id="engineNote"></em>
          <div class="ep-bi-row" id="deeplKeyRow">
            <input class="ep-input" id="deeplKey" type="password" placeholder="DeepL Auth Key（免费版以 :fx 结尾）" autocomplete="off" spellcheck="false" />
          </div>
          <div class="ep-bi-row" id="baiduAppIdRow" hidden>
            <input class="ep-input" id="baiduAppId" placeholder="百度翻译 APP ID" autocomplete="off" spellcheck="false" />
          </div>
          <div class="ep-bi-row" id="baiduKeyRow" hidden>
            <input class="ep-input" id="baiduKey" type="password" placeholder="百度翻译密钥" autocomplete="off" spellcheck="false" />
          </div>
          <div class="ep-field__row ep-row-gap"><span>原文列宽</span><em id="vBiSplit"></em></div>
          <input id="biSplit" type="range" min="35" max="70" step="1" />
          <em class="ep-check__note" id="translateStatus"></em>
          <div class="ep-field__row ep-row-gap">
            <span>缓存上限</span>
            <input class="ep-input ep-input--num" id="biCacheMax" type="number" min="100" max="20000" step="100" />
            <span>段</span>
          </div>
          <em class="ep-check__note" id="biCacheSize">正在读取缓存…</em>
        </section>
      </div>

      <footer class="ep-panel__foot">
        <button type="button" id="printBtn" class="ep-btn ep-btn--primary">打印</button>
        <button type="button" id="exportBtn" class="ep-btn">导出 HTML</button>
      </footer>
    </aside>
  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
