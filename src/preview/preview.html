<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Element Print · 打印预览</title>
  <link rel="stylesheet" href="../shared/article.css" />
  <link rel="stylesheet" href="../shared/themes/academic.css" />
  <link rel="stylesheet" href="../shared/themes/gov.css" />
  <link rel="stylesheet" href="preview.css" />
  <style id="pageRule"></style>
</head>
<body>
  <div class="ep-app">
    <main class="ep-stage">
      <div class="ep-hint">
        <span class="ep-hint__text" id="hintText" data-i18n="baseHint">右侧设置即时生效</span>
        <span class="ep-count" id="wordCount"></span>
        <div class="ep-hint__actions">
          <button type="button" id="editBtn" class="ep-mini ep-mini--icon" title="进入编辑：直接修改标题、正文与页眉页脚（Esc 退出，有改动会确认）" aria-label="编辑">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.2 1.8 14.2 4.8 5.6 13.4 1.9 14.1 2.6 10.4z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.6 3.4 12.6 6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" id="trimBtn" class="ep-mini ep-mini--icon" title="进入删减：点击要删掉的段落、图片或表格所在块（Esc 退出）" aria-label="删减">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.2" cy="5.4" r="2.1" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="4.2" cy="10.6" r="2.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.3 6.4 13.4 10.9M6.3 9.6 13.4 5.1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" id="titleBtn" class="ep-mini ep-mini--icon" title="设置标题：从正文选择并替换当前标题（Esc 退出）" aria-label="标题">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 3.2h11.2M8 3.2v8.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4.6 12.9h6.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" id="imgBtn" class="ep-mini ep-mini--icon" title="切换图片显示：无图时图片不参与排版与打印" aria-label="有图">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.9" y="2.6" width="12.2" height="10.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5.4" cy="6" r="1.3" fill="currentColor" opacity=".55"/><path d="M2.6 11.6 6.6 8.2l3 2.5 2.3-1.9 1.5 1.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" id="readBtn" class="ep-mini ep-mini--icon" title="阅读模式：隐藏右栏设置与顶部工具条，只看版面" aria-label="阅读模式">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 12h2M16 8h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="ep-bi-switch">
            <button type="button" id="origBtn" class="ep-mini ep-mini--soft ep-mini--seg" title="回到单栏原文视图">原文</button>
            <span class="ep-bi-switch__sep" id="origMixSep"></span>
            <button type="button" id="mixBtn" class="ep-mini ep-mini--soft ep-mini--seg" hidden title="按原网页的中英混排方式显示">混排</button>
            <span class="ep-bi-switch__sep" id="mixSep" hidden></span>
            <button type="button" id="biBtn" class="ep-mini ep-mini--soft ep-mini--seg" title="翻译：A4/电纸书左右对照；手机自动按原文/译文串行排列">翻译</button>
          </div>
        </div>
      </div>
      <!-- 阅读模式的退出按钮：阅读模式下顶部工具条隐藏，这个浮在右上角 -->
      <button type="button" id="readExit" class="ep-mini ep-mini--icon ep-read-exit" title="退出阅读模式" aria-label="退出阅读模式" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 12h2M16 8h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- 阅读模式的全屏按钮：像 F11 那样把浏览器官栏一起收起来 -->
      <button type="button" id="readFsBtn" class="ep-mini ep-mini--icon ep-read-exit ep-read-fs" title="全屏" aria-label="全屏" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- 阅读模式的配色：一个调色图标，点开是 8 种纸墨配色 -->
      <div class="ep-read-theme" id="readTheme" hidden>
        <button type="button" id="readThemeBtn" class="ep-mini ep-mini--icon ep-read-exit ep-read-theme__btn" title="阅读配色" aria-label="阅读配色">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18 2 2 0 0 0 2-2v-1a2 2 0 0 1 2-2h1a2 2 0 0 0 2-2 9 9 0 0 0-9-9Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.2" fill="currentColor"/><circle cx="12" cy="6.6" r="1.2" fill="currentColor"/><circle cx="16" cy="9" r="1.2" fill="currentColor"/></svg>
        </button>
        <div class="ep-read-theme__panel" id="readThemePanel" hidden>
          <div class="ep-read-theme__grid" id="readThemeGrid"></div>
          <div class="ep-read-theme__bg">
            <span class="ep-read-theme__bglabel" data-i18n="readBgLabel">背景</span>
            <button type="button" class="ep-read-theme__dot" data-bg="#cfe8d6" title="护眼绿"></button>
            <button type="button" class="ep-read-theme__dot" data-bg="#eee6d6" title="米色"></button>
            <button type="button" class="ep-read-theme__dot" data-bg="#dfe4e8" title="浅灰"></button>
            <button type="button" class="ep-read-theme__dot" data-bg="#25282c" title="深色"></button>
            <button type="button" class="ep-read-theme__file" id="readBgPick" data-i18n="readBgImage">图片…</button>
            <button type="button" class="ep-read-theme__file" id="readBgClear" data-i18n="readBgClear">清除</button>
            <input type="file" id="readBgFile" accept="image/*" hidden />
          </div>
        </div>
      </div>
      <!-- 阅读模式的字号与行距：图标加减，没有滑杆和输入框 -->
      <div class="ep-read-theme ep-read-type" id="readType" hidden>
        <button type="button" id="readTypeBtn" class="ep-mini ep-mini--icon ep-read-exit ep-read-theme__btn" title="字号与行高" aria-label="字号与行高">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="9" y1="20" x2="15" y2="20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="ep-read-theme__panel ep-read-type__panel" id="readTypePanel" hidden>
          <div class="ep-read-type__row">
            <span class="ep-read-type__label" data-i18n="bodyFontSize">字号</span>
            <span class="ep-read-type__value" id="readFontVal">16</span>
            <button type="button" class="ep-read-type__step" id="readFontDown" title="字号减小" aria-label="字号减小">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="ep-read-type__step" id="readFontUp" title="字号增大" aria-label="字号增大">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="ep-read-type__row">
            <span class="ep-read-type__label" data-i18n="readLineUnit">行高</span>
            <span class="ep-read-type__value" id="readLineVal">30</span>
            <button type="button" class="ep-read-type__step" id="readLineDown" title="行高减小" aria-label="行高减小">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="ep-read-type__step" id="readLineUp" title="行高增大" aria-label="行高增大">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
      </div>
      <!-- 编辑时的格式栏：作用于当前选区，全部为图标按钮，悬停显示名称 -->
      <div class="ep-format" id="formatBar" hidden>
        <button type="button" class="ep-fmt" data-cmd="fontDown" title="缩小字号" aria-label="缩小字号">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="3" y="12" font-size="11" fill="currentColor">A</text><text x="8.5" y="8" font-size="7.5" fill="currentColor">−</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="fontUp" title="放大字号" aria-label="放大字号">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="2.5" y="12" font-size="11" fill="currentColor">A</text><text x="8.5" y="8" font-size="7.5" fill="currentColor">+</text></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="bold" title="粗体" aria-label="粗体">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">B</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="italic" title="斜体" aria-label="斜体">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="13" font-style="italic" font-family="Georgia,serif" fill="currentColor">I</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="underline" title="下划线" aria-label="下划线">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="11.5" text-anchor="middle" font-size="12" fill="currentColor">U</text><rect x="3.5" y="13.2" width="9" height="1.4" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="strikeThrough" title="删除线" aria-label="删除线">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor">S</text><rect x="3" y="7.3" width="10" height="1.3" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="justifyLeft" title="左对齐" aria-label="左对齐">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="1.6" fill="currentColor"/><rect x="2.5" y="7.2" width="7" height="1.6" fill="currentColor"/><rect x="2.5" y="11.4" width="11" height="1.6" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="justifyCenter" title="居中" aria-label="居中">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="1.6" fill="currentColor"/><rect x="4.5" y="7.2" width="7" height="1.6" fill="currentColor"/><rect x="2.5" y="11.4" width="11" height="1.6" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="justifyRight" title="右对齐" aria-label="右对齐">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="1.6" fill="currentColor"/><rect x="6.5" y="7.2" width="7" height="1.6" fill="currentColor"/><rect x="2.5" y="11.4" width="11" height="1.6" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="indent" title="首行缩进" aria-label="首行缩进">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="3" width="7.5" height="1.6" fill="currentColor"/><rect x="6" y="7.2" width="7.5" height="1.6" fill="currentColor"/><rect x="6" y="11.4" width="7.5" height="1.6" fill="currentColor"/><path d="M2.2 6.2 L4.6 8 L2.2 9.8 Z" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="h2" title="一级标题" aria-label="一级标题">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">H2</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="h3" title="二级标题" aria-label="二级标题">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">H3</text></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="quote" title="引文块" aria-label="引文块">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.4" y="3.4" width="1.6" height="9.2" fill="currentColor"/><text x="4" y="12" font-size="12" font-family="Georgia,serif" fill="currentColor">“</text></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="ol" title="有序列表" aria-label="有序列表">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="1" y="5.6" font-size="5" fill="currentColor">1</text><text x="1" y="10.6" font-size="5" fill="currentColor">2</text><text x="1" y="15.4" font-size="5" fill="currentColor">3</text><rect x="6" y="3.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="8.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="13.2" width="9" height="1.4" fill="currentColor"/></svg>
        </button>
        <button type="button" class="ep-fmt" data-cmd="ul" title="无序列表" aria-label="无序列表">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="2.6" cy="4.1" r="1.5" fill="currentColor"/><circle cx="2.6" cy="9.1" r="1.5" fill="currentColor"/><circle cx="2.6" cy="13.7" r="1.5" fill="currentColor"/><rect x="6" y="3.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="8.4" width="9" height="1.4" fill="currentColor"/><rect x="6" y="13.2" width="9" height="1.4" fill="currentColor"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="clearFormat" title="清除格式" aria-label="清除格式">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="6" y="12" text-anchor="middle" font-size="12" fill="currentColor">A</text><rect x="5.3" y="1.5" width="1.4" height="13" fill="currentColor" transform="rotate(70 6 8)"/></svg>
        </button>
        <span class="ep-format__sep"></span>
        <button type="button" class="ep-fmt" data-cmd="replace" title="查找并替换（替换文本可空）" aria-label="查找并替换">
          <svg viewBox="0 0 16 16" aria-hidden="true"><text x="1" y="12" font-size="9" fill="currentColor">A</text><path d="M6.4 8h3.4M8.4 5.6L10.8 8L8.4 10.4" stroke="currentColor" fill="none" stroke-width="1.1"/><text x="11" y="12" font-size="9" fill="currentColor">B</text></svg>
        </button>
      </div>
      <!-- 查找替换面板：在标题、正文、页眉页脚的文本节点内全局替换 -->
      <div class="ep-replace" id="replacePanel" hidden>
        <input class="ep-input" id="replaceFind" type="text" data-i18n-placeholder="replaceFindPlaceholder" placeholder="查找文本" autocomplete="off" />
        <input class="ep-input" id="replaceRepl" type="text" data-i18n-placeholder="replaceReplPlaceholder" placeholder="替换为（留空删除）" autocomplete="off" />
        <button type="button" id="replaceGo" class="ep-mini">替换</button>
        <button type="button" id="replaceClose" class="ep-mini">取消</button>
      </div>
      <!-- 翻译进度提示：浮在工具栏右下方 -->
      <div class="ep-toast" id="translateToast" hidden><span class="ep-toast__dot"></span><span id="translateToastText"></span></div>
      <div class="ep-viewport" id="viewport">
        <!-- 双语混排提示：只在探测判定成立、且当前不是对照视图时出现 -->
        <div class="ep-biHint" id="biHint" hidden>
          <span class="ep-biHint__text" id="biHintText"></span>
          <button type="button" class="ep-biHint__go" id="biHintGo"></button>
          <button type="button" class="ep-biHint__off" id="biHintOff"></button>
        </div>
        <div class="ep-sheetWrap" id="sheetWrap">
            <div class="ep-sheet" id="sheet" data-theme="paper">
            <div class="ep-gutter ep-gutter--head" id="pageHead">
              <span class="ep-gutter__title">Element Print</span>
              <span class="ep-gutter__src" id="pageSource"><a id="siteLink" href="#" target="_blank" rel="noreferrer"></a></span>
            </div>
            <div class="ep-head">
              <h1 class="ep-title" id="title"></h1>
              <p class="ep-title-trans" id="titleTrans" hidden></p>
              <p class="ep-excerpt" id="excerpt" hidden></p>
              <p class="ep-excerpt-trans" id="excerptTrans" hidden></p>
              <div class="ep-rule"></div>
              <div class="ep-meta" id="meta">
                <span class="ep-meta__byline">
                  <span id="metaAuthor" hidden></span>
                  <span id="metaPubDate" hidden></span>
                </span>
                <a class="ep-meta__url" id="metaUrl" href="#" target="_blank" rel="noreferrer"></a>
                <span class="ep-meta__time" id="metaTime"></span>
              </div>
            </div>
            <div class="ep-body" id="body"></div>
            <div class="ep-bilingual ep-body" id="bilingual" hidden></div>
            <div class="ep-body" id="mixed" hidden></div>
            <div class="ep-body" id="serial" hidden></div>
            <p class="ep-end-quote" id="endQuote" hidden></p>
            <div class="ep-gutter ep-gutter--foot" id="pageFoot">
              <span class="ep-gutter__quote" id="pageQuote"></span>
              <span class="ep-gutter__page" id="pageNo"></span>
            </div>
          </div>
        </div>
        <div class="ep-read-pager" id="readPager" hidden><button class="ep-read-pager__home" id="readPagerHome" type="button" data-i18n-title="readBackHome"></button><span class="ep-read-pager__text"></span><i class="ep-read-pager__bar"></i></div>
        <div class="ep-read-pages" id="readPages" hidden></div>
        <div class="ep-error" id="error" hidden></div>
      </div>
    </main>

    <aside class="ep-panel">
      <header class="ep-panel__head">
        <div class="ep-panel__title" data-i18n="panelTitle">版式设置</div>
        <button type="button" id="resetBtn" class="ep-mini" data-i18n="resetLayout">重置版式</button>
      </header>

      <div class="ep-panel__body">
        <section class="ep-field">
          <div class="ep-field__label" data-i18n="outputObject">输出对象</div>
          <div class="ep-seg ep-seg--three" id="segPageFormat">
            <button type="button" data-value="a4" class="is-active" data-i18n="a4Paper">A4纸</button>
            <button type="button" data-value="ereader" data-i18n-title="ereaderTitle" title="10寸左右的大屏电纸书" data-i18n="ereader">电纸书</button>
            <button type="button" data-value="mobile" data-i18n="mobile">手机</button>
          </div>
        </section>

        <section class="ep-field">
          <div class="ep-field__label" data-i18n="layout">版式</div>
          <div class="ep-seg ep-seg--three" id="segTheme">
            <button type="button" data-value="paper" class="is-active" data-i18n="paper">原版</button>
            <button type="button" data-value="academic" data-i18n="academic">学术期刊</button>
            <button type="button" data-value="gov" data-i18n="gov" data-locale-hide="zh">公文</button>
          </div>
        </section>

        <section class="ep-field">
          <div class="ep-field__label" data-i18n="columns">栏数</div>
          <div class="ep-seg" id="segColumns">
            <button type="button" data-value="1" class="is-active" data-i18n="oneColumn">单栏</button>
            <button type="button" data-value="2" data-i18n="twoColumns">两栏</button>
          </div>
          <em class="ep-check__note" id="columnsNote"></em>
        </section>

        <section class="ep-field">
          <div class="ep-field__label" data-i18n="imageSize">图片大小</div>
          <div class="ep-seg ep-seg--three" id="segImgSize">
            <button type="button" data-value="small" data-i18n="small">小</button>
            <button type="button" data-value="mid" data-i18n="medium">中</button>
            <button type="button" data-value="full" class="is-active" data-i18n="original">原大</button>
          </div>
        </section>

        <!-- 文字排版：标题 / 一级标题 / 正文 三套各自独立 -->
        <section class="ep-field">
          <div class="ep-tabs" id="segTypeTab">
            <button type="button" data-value="title" class="is-active" data-i18n="tabTitle">标题</button>
            <button type="button" data-value="head" data-i18n="tabHead">一级标题</button>
            <button type="button" data-value="body" data-i18n="tabBody">正文</button>
          </div>

          <!-- 大标题 -->
          <div class="ep-tabpane" id="paneTitle">
            <div class="ep-field__label" data-i18n="font">字体</div>
            <select class="ep-select" id="titleFont"></select>
            <div class="ep-field__label ep-row-gap" data-i18n="fontWeight">字重</div>
            <div class="ep-seg ep-seg--four" id="segTitleWeight">
              <button type="button" data-value="normal" data-i18n="weightNormal">常规</button>
              <button type="button" data-value="medium" data-i18n="weightMedium">中等</button>
              <button type="button" data-value="semibold" data-i18n="weightSemibold">半粗</button>
              <button type="button" data-value="bold" class="is-active" data-i18n="weightBold">粗体</button>
            </div>
            <div class="ep-field__row ep-row-gap"><span data-i18n="titleFontSize">字号</span><em id="vTitleSize"></em></div>
            <input id="titleSize" type="range" min="12" max="64" step="0.5" />
            <div class="ep-field__label ep-row-gap" data-i18n="lineHeight">行距</div>
            <div class="ep-seg" id="segTitleLineMode">
              <button type="button" data-value="ratio" class="is-active" data-i18n="ratioMode">按倍数</button>
              <button type="button" data-value="fixed" data-i18n="fixedMode">固定磅值</button>
            </div>
            <div class="ep-field__row ep-row-gap"><span data-i18n="lineHeightValue">行高</span><em id="vTitleLine"></em></div>
            <input id="titleLine" type="range" min="1.2" max="2.4" step="0.05" />
            <div class="ep-field__row"><span data-i18n="spaceBefore">段前间距</span><em id="vTitleMt"></em></div>
            <input id="titleMt" type="range" min="0" max="40" step="1" />
            <div class="ep-field__row"><span data-i18n="spaceAfter">段后间距</span><em id="vTitleMb"></em></div>
            <input id="titleMb" type="range" min="0" max="40" step="1" />
          </div>

          <!-- 一级标题（正文 h1，双栏时可跨栏；h2 跟随） -->
          <div class="ep-tabpane" id="paneHead" hidden>
            <div class="ep-field__label" data-i18n="font">字体</div>
            <select class="ep-select" id="h1Font"></select>
            <div class="ep-field__label ep-row-gap" data-i18n="fontWeight">字重</div>
            <div class="ep-seg ep-seg--four" id="segH1Weight">
              <button type="button" data-value="normal" data-i18n="weightNormal">常规</button>
              <button type="button" data-value="medium" data-i18n="weightMedium">中等</button>
              <button type="button" data-value="semibold" data-i18n="weightSemibold">半粗</button>
              <button type="button" data-value="bold" class="is-active" data-i18n="weightBold">粗体</button>
            </div>
            <div class="ep-field__row ep-row-gap"><span data-i18n="size">字号</span><em id="vH1Size"></em></div>
            <input id="h1Size" type="range" min="8" max="48" step="0.5" />
            <div class="ep-field__label ep-row-gap" data-i18n="lineHeight">行距</div>
            <div class="ep-seg" id="segH1LineMode">
              <button type="button" data-value="ratio" class="is-active" data-i18n="ratioMode">按倍数</button>
              <button type="button" data-value="fixed" data-i18n="fixedMode">固定磅值</button>
            </div>
            <div class="ep-field__row ep-row-gap"><span data-i18n="lineHeightValue">行高</span><em id="vH1Line"></em></div>
            <input id="h1Line" type="range" min="1.2" max="2.4" step="0.05" />
            <div class="ep-field__row"><span data-i18n="spaceBefore">段前间距</span><em id="vH1Mt"></em></div>
            <input id="h1Mt" type="range" min="0" max="40" step="1" />
            <div class="ep-field__row"><span data-i18n="spaceAfter">段后间距</span><em id="vH1Mb"></em></div>
            <input id="h1Mb" type="range" min="0" max="40" step="1" />
            <em class="ep-check__note" data-i18n="h1Note">正文 h1，双栏时可跨栏；h2 跟随同一套设置</em>
          </div>

          <!-- 正文 -->
          <div class="ep-tabpane" id="paneBody" hidden>
            <div class="ep-field__label" data-i18n="font">字体</div>
            <select class="ep-select" id="bodyFont"></select>
            <div class="ep-field__label ep-row-gap" data-i18n="fontWeight">字重</div>
            <div class="ep-seg ep-seg--four" id="segBodyWeight">
              <button type="button" data-value="normal" class="is-active" data-i18n="weightNormal">常规</button>
              <button type="button" data-value="medium" data-i18n="weightMedium">中等</button>
              <button type="button" data-value="semibold" data-i18n="weightSemibold">半粗</button>
              <button type="button" data-value="bold" data-i18n="weightBold">粗体</button>
            </div>
            <div class="ep-field__row ep-row-gap"><span data-i18n="bodyFontSize">字号</span><em id="vFontSize"></em></div>
            <input id="fontSize" type="range" min="9" max="20" step="0.5" />
            <div class="ep-field__label ep-row-gap" data-i18n="lineHeight">行距</div>
            <div class="ep-seg" id="segLineMode">
              <button type="button" data-value="ratio" class="is-active" data-i18n="ratioMode">按倍数</button>
              <button type="button" data-value="fixed" data-i18n="fixedMode">固定磅值</button>
            </div>
            <div class="ep-field__row ep-row-gap"><span data-i18n="lineHeightValue">行高</span><em id="vLineHeight"></em></div>
            <input id="lineHeight" type="range" min="1.2" max="2.4" step="0.05" />
            <div class="ep-field__row"><span data-i18n="spaceBefore">段前间距</span><em id="vParaBefore"></em></div>
            <input id="paraBefore" type="range" min="0" max="40" step="1" />
            <div class="ep-field__row"><span data-i18n="spaceAfter">段后间距</span><em id="vParaAfter"></em></div>
            <input id="paraAfter" type="range" min="0" max="48" step="1" />
            <div class="ep-field__row"><span data-i18n="indent">首行缩进</span><em id="vIndent"></em></div>
            <input id="indent" type="range" min="0" max="4" step="1" />
          </div>
        </section>

        <section class="ep-field">
          <div class="ep-field__label ep-label-row">
            <span data-i18n="marginMm">页边距（mm）</span>
            <span class="ep-pills" id="segMarginPreset">
              <button type="button" data-value="narrow" class="ep-pill" data-i18n="marginNarrow">窄</button>
              <button type="button" data-value="medium" class="ep-pill" data-i18n="marginMedium">中</button>
              <button type="button" data-value="wide" class="ep-pill" data-i18n="marginWide">宽</button>
            </span>
          </div>
          <div class="ep-margins">
            <div class="ep-margin">
              <div class="ep-field__row"><span data-i18n="marginTop">上</span><em id="vMarginTop"></em></div>
              <input id="marginTop" type="range" min="3" max="40" step="1" />
            </div>
            <div class="ep-margin">
              <div class="ep-field__row"><span data-i18n="marginBottom">下</span><em id="vMarginBottom"></em></div>
              <input id="marginBottom" type="range" min="3" max="40" step="1" />
            </div>
            <div class="ep-margin">
              <div class="ep-field__row"><span data-i18n="marginLeft">左</span><em id="vMarginLeft"></em></div>
              <input id="marginLeft" type="range" min="3" max="40" step="1" />
            </div>
            <div class="ep-margin">
              <div class="ep-field__row"><span data-i18n="marginRight">右</span><em id="vMarginRight"></em></div>
              <input id="marginRight" type="range" min="3" max="40" step="1" />
            </div>
          </div>
        </section>

        <section class="ep-field ep-field--checks">
          <label class="ep-check"><input type="checkbox" id="showUrl" /><span data-i18n="showUrl">显示网址</span></label>
          <label class="ep-check"><input type="checkbox" id="showTime" /><span data-i18n="showTimestamp">显示时间戳</span></label>
          <label class="ep-check"><input type="checkbox" id="showExcerpt" /><span data-i18n="showExcerpt">显示摘要</span></label>
          <label class="ep-check"><input type="checkbox" id="spanHead" /><span data-i18n="spanHead">一级标题跨栏（双栏时）</span></label>
          <label class="ep-check"><input type="checkbox" id="allowBreak" /><span data-i18n="allowBreak">段落可跨页<em class="ep-check__note" data-i18n="allowBreakNote">取消勾选则整段移到下一页</em></span></label>
          <label class="ep-check"><input type="checkbox" id="showHeader" /><span data-i18n="showHeader">显示页眉</span></label>
          <label class="ep-check"><input type="checkbox" id="showFooter" /><span data-i18n="showFooter">显示页脚<em class="ep-check__note" data-i18n="footerNote">A4 右下页码，电纸书只格言</em></span></label>
          <label class="ep-check"><input type="checkbox" id="showQuote" /><span data-i18n="showQuote">页脚名言<em class="ep-check__note" data-i18n="quoteNote">随机一句，取自本地名句库</em></span></label>
          <label class="ep-check"><input type="checkbox" id="inkBlack" /><span data-i18n="inkBlack">文字纯黑<em class="ep-check__note" data-i18n="inkBlackNote">适合黑色颜料墨打印</em></span></label>
          <label class="ep-check"><input type="checkbox" id="hideBiBadge" /><span data-i18n="hideBiBadge">隐藏译文提示<em class="ep-check__note" data-i18n="hideBiBadgeNote">不显示「页面」「缓存」这类来源角标</em></span></label>
          <label class="ep-check"><input type="checkbox" id="readAutoFullscreen" /><span data-i18n="readAutoFullscreen">阅读模式直接全屏<em class="ep-check__note" data-i18n="readAutoFullscreenNote">进阅读模式时同时进入全屏</em></span></label>
          <label class="ep-check"><input type="checkbox" id="closeAfterPrint" /><span data-i18n="closeAfterPrint">打印后自动关闭<em class="ep-check__note" data-i18n="closeAfterPrintNote">打印后关闭预览页</em></span></label>
        </section>

        <section class="ep-field">
          <div class="ep-field__label" data-i18n="bilingual">双语对照</div>
          <div class="ep-field__row ep-row-gap"><span data-i18n="sourceColumnWidth">原文列宽</span><em id="vBiSplit"></em></div>
          <input id="biSplit" type="range" min="35" max="70" step="1" />
          <em class="ep-check__note" id="translateStatus"></em>
        </section>

        <!-- 高级：机器翻译 API 相关设置，普通用户不需要，默认折叠 -->
        <section class="ep-field ep-adv">
          <button type="button" id="advToggle" class="ep-adv__toggle" aria-expanded="false">
            <span data-i18n="advanced">高级</span><em class="ep-adv__caret" aria-hidden="true">▸</em>
          </button>
          <div class="ep-adv__body" id="advBody" hidden>
            <div class="ep-field__row ep-row-gap"><span data-i18n="translate">翻译</span><button type="button" id="translateBtn" class="ep-mini" data-i18n="translate">翻译</button></div>
            <label class="ep-check"><input type="checkbox" id="bilingualOn" /><span data-i18n="autoTranslate">自动翻译</span></label>
            <div class="ep-field__row ep-row-gap"><span data-i18n="engine">翻译引擎</span></div>
            <select class="ep-select" id="biEngine">
              <option value="deepl">DeepL</option>
              <option value="baidu" data-locale-hide="zh">百度翻译</option>
            </select>
            <div class="ep-field__row ep-row-gap"><span data-i18n="targetLang">翻译成</span></div>
            <select class="ep-select" id="biTargetLang">
              <option value="EN" data-i18n="targetEnglish">英语</option>
              <option value="ZH" data-i18n="targetChinese">中文</option>
            </select>
            <em class="ep-check__note" id="engineNote"></em>
            <div class="ep-bi-row" id="deeplKeyRow">
              <input class="ep-input" id="deeplKey" type="password" data-i18n-placeholder="deeplKeyPlaceholder" placeholder="DeepL Auth Key（免费版以 :fx 结尾）" autocomplete="off" spellcheck="false" />
            </div>
            <div class="ep-bi-row" id="baiduAppIdRow" hidden>
              <input class="ep-input" id="baiduAppId" data-i18n-placeholder="baiduAppIdPlaceholder" placeholder="百度翻译 APP ID" autocomplete="off" spellcheck="false" />
            </div>
            <div class="ep-bi-row" id="baiduKeyRow" hidden>
              <input class="ep-input" id="baiduKey" type="password" data-i18n-placeholder="baiduKeyPlaceholder" placeholder="百度翻译密钥" autocomplete="off" spellcheck="false" />
            </div>
            <div class="ep-field__row ep-row-gap">
              <span data-i18n="cacheLimit">缓存上限</span>
              <input class="ep-input ep-input--num" id="biCacheMax" type="number" min="100" max="20000" step="100" />
              <span data-i18n="segments">段</span>
            </div>
            <em class="ep-check__note" id="biCacheSize" data-i18n="cacheLoading">正在读取缓存…</em>
          </div>
        </section>
      </div>

      <footer class="ep-panel__foot">
        <button type="button" id="printBtn" class="ep-btn ep-btn--primary" data-i18n="print">打印</button>
        <button type="button" id="exportBtn" class="ep-btn" data-i18n="exportHtml">导出 HTML</button>
      </footer>
    </aside>
  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
